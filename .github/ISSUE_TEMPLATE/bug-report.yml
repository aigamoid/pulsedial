name: Bug report / 不具合の報告
description: Something in PulseDial doesn't work / PulseDial がうまく動かない
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Please check the README's install steps first. Never paste your Client ID's secret, tokens or Wi-Fi passwords here.
        README の手順をもう一度確かめてから書いてください。鍵（トークン）や Wi-Fi のパスワードは書かないでください。
  - type: dropdown
    id: step
    attributes:
      label: Where did it happen? / どこで起きましたか
      options:
        - Install from the browser / ブラウザでの書き込み
        - Wi-Fi setup / Wi-Fi の設定
        - Spotify login (QR) / Spotify ログイン（QR）
        - Playing / 再生中の操作や表示
        - Build from source / ソースからのビルド
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened? / 何が起きましたか
      description: Steps, what you expected, what you saw (screenshots or photos help). / 手順、期待したこと、実際に出たこと（写真があると助かります）
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment / 環境
      description: PC OS + browser, phone (for QR login), PulseDial version or commit. / PC の OS とブラウザ、スマホ、PulseDial の版
